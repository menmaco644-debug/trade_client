name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf automake libtool pkg-config libltdl-dev m4 ccache
      - name: Install Python deps
        run: |
          pip install python-for-android cython
      - name: Setup Android SDK
        run: |
          sudo mkdir -p /opt/android-sdk
          sudo chmod 777 /opt/android-sdk
          cd /opt/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.0" "platforms;android-33" "ndk;25.2.9519653" > /dev/null 2>&1
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
      - name: Build APK
        run: |
          p4a apk --private . --package=org.trade.client --name "Trade Client" --version 1.1.5 --bootstrap=sdl2 --requirements=python3,kivy,kivymd,cython --arch=arm64-v8a --release --android-api 33 --ndk-api 24
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trade-client-apk
          path: "*.apk"
